<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>AuricAI | Indian Stock Sentiment</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f6fb;
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; }
    main { width: min(1200px, calc(100% - 40px)); margin: 0 auto; padding: 32px 0; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: clamp(1.6rem, 3vw, 2.2rem); }
    .back-link { color: #1d4ed8; font-size: .9rem; font-weight: 650; text-decoration: none; }
    .description, .status, .stock-name, .period-label, .empty { color: #64748b; }
    .description { margin: 8px 0 20px; font-size: .9rem; line-height: 1.5; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .status { margin: 0; font-size: .82rem; }
    button { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; color: #334155; font: inherit; cursor: pointer; }
    button:disabled { cursor: default; opacity: .5; }
    .grid { display: grid; max-height: min(72vh, 760px); grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; overflow-y: auto; padding: 2px 6px 6px 2px; overscroll-behavior: contain; scroll-behavior: smooth; scrollbar-gutter: stable; }
    .card { min-width: 0; padding: 14px; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; }
    .stock-name { overflow: hidden; font-size: .76rem; text-overflow: ellipsis; white-space: nowrap; }
    .symbol { margin-top: 4px; font-size: 1rem; font-weight: 750; }
    .periods { display: grid; gap: 8px; margin-top: 12px; }
    .period { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; font-size: .72rem; }
    .badge { max-width: 100%; padding: 4px 7px; border-radius: 999px; font-size: .68rem; font-weight: 700; white-space: normal; }
    .positive { background: #dcfce7; color: #166534; }
    .negative { background: #fee2e2; color: #991b1b; }
    .neutral { background: #f1f5f9; color: #475569; }
    .empty { grid-column: 1 / -1; margin: 0; padding: 18px; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; }
    @media (max-width: 900px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 650px) {
      main { width: calc(100% - 28px); padding: 24px 0; }
      .grid { max-height: 72vh; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 400px) { .grid { grid-template-columns: minmax(0, 1fr); } }
    @media (prefers-color-scheme: dark) {
      :root { color: #e5e7eb; background: #0b1220; }
      .back-link { color: #93c5fd; }
      .description, .status, .stock-name, .period-label, .empty { color: #94a3b8; }
      button, .card, .empty { border-color: #263248; background: #111b2e; color: #e5e7eb; }
      .positive { background: #14532d; color: #bbf7d0; }
      .negative { background: #7f1d1d; color: #fecaca; }
      .neutral { background: #334155; color: #e2e8f0; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Indian Stock Sentiment</h1>
      <a class="back-link" href="/">Back to dashboard</a>
    </header>
    <p class="description">News-text sentiment for matched companies in the NSE symbol list. BSE-only listings are not included. Short: 7 days · Medium: 30 days · Long: 90 days. Sentiment is not a forecast or investment recommendation.</p>
    <div class="toolbar">
      <p id="status" class="status" aria-live="polite">Loading stock sentiment…</p>
      <div>
        <button id="scroll-up" type="button" aria-label="Scroll stocks up" disabled>↑</button>
        <button id="scroll-down" type="button" aria-label="Scroll stocks down" disabled>↓</button>
      </div>
    </div>
    <section id="stocks" class="grid" aria-label="Stock sentiment by timeframe" tabindex="0"></section>
  </main>
  <script>
    const stocksNode = document.getElementById("stocks");
    const statusNode = document.getElementById("status");
    const upButton = document.getElementById("scroll-up");
    const downButton = document.getElementById("scroll-down");

    function updateScrollButtons() {
      const maxScroll = stocksNode.scrollHeight - stocksNode.clientHeight;
      upButton.disabled = maxScroll <= 0 || stocksNode.scrollTop <= 0;
      downButton.disabled = maxScroll <= 0 || stocksNode.scrollTop >= maxScroll - 1;
    }

    function makeElement(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      node.textContent = text;
      return node;
    }

    function renderStocks(stocks) {
      stocksNode.replaceChildren();
      if (!stocks.length) {
        stocksNode.append(makeElement("p", "empty", "No NSE-listed stocks were identified in the available news."));
      }
      for (const stock of stocks) {
        const card = makeElement("article", "card", "");
        card.append(makeElement("div", "stock-name", stock.name));
        card.append(makeElement("div", "symbol", stock.symbol));
        const periods = makeElement("div", "periods", "");
        for (const [key, label] of [
          ["short_term", "Short · 7d"],
          ["medium_term", "Medium · 30d"],
          ["long_term", "Long · 90d"]
        ]) {
          const value = stock[key];
          const row = makeElement("div", "period", "");
          row.append(makeElement("span", "period-label", label));
          if (value) {
            const countLabel = value.article_count === 1 ? "article" : "articles";
            row.append(makeElement(
              "span",
              `badge ${value.label.toLowerCase()}`,
              `${value.label} · ${Number(value.compound).toFixed(2)} · ${value.article_count} ${countLabel}`
            ));
          } else {
            row.append(makeElement("span", "period-label", "No dated news"));
          }
          periods.append(row);
        }
        card.append(periods);
        stocksNode.append(card);
      }
      requestAnimationFrame(updateScrollButtons);
    }

    upButton.addEventListener("click", () => {
      stocksNode.scrollBy({ top: -stocksNode.clientHeight * 0.8, behavior: "smooth" });
    });
    downButton.addEventListener("click", () => {
      stocksNode.scrollBy({ top: stocksNode.clientHeight * 0.8, behavior: "smooth" });
    });
    stocksNode.addEventListener("scroll", updateScrollButtons);

    fetch("/api/news")
      .then(async (response) => {
        if (!response.ok) throw new Error(`Could not load stock sentiment (HTTP ${response.status}).`);
        return response.json();
      })
      .then((data) => {
        renderStocks(data.stock_sentiments || []);
        statusNode.textContent = data.updated_at
          ? `Updated ${new Date(data.updated_at).toLocaleString()}`
          : "Updated";
      })
      .catch((error) => {
        statusNode.textContent = error.message;
        stocksNode.replaceChildren(makeElement("p", "empty", "Stock sentiment could not be loaded. Please try again later."));
      });
  </script>
</body>
</html>
