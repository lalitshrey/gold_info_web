<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>AuricAI | Account</title>
  <link href="/static/tailwind.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-100 text-slate-800 dark:bg-[#0b1220] dark:text-slate-100">
  <main class="mx-auto flex min-h-screen w-[calc(100%-2rem)] max-w-md items-center py-10">
    <section class="w-full rounded-2xl border border-slate-200 bg-white p-7 shadow-xl dark:border-slate-700 dark:bg-slate-900">
      <a href="/" class="text-sm font-bold uppercase tracking-[.2em] text-amber-700 dark:text-amber-300">AuricAI</a>
      <h1 id="page-title" class="mt-5 text-2xl font-bold">Sign in</h1>
      <p id="page-description" class="mt-2 text-sm text-slate-600 dark:text-slate-400">Sign in to view the market dashboard.</p>

      <form id="auth-form" class="mt-6 grid gap-4">
        <div id="registration-fields" class="hidden grid-cols-2 gap-4">
          <label class="grid gap-1.5 text-sm font-medium" for="first-name">
            First name
            <input id="first-name" name="first_name" type="text" autocomplete="given-name" maxlength="100"
              class="rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-base outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-200 dark:border-slate-600 dark:bg-slate-800 dark:focus:ring-blue-900">
          </label>
          <label class="grid gap-1.5 text-sm font-medium" for="last-name">
            Last name
            <input id="last-name" name="last_name" type="text" autocomplete="family-name" maxlength="100"
              class="rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-base outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-200 dark:border-slate-600 dark:bg-slate-800 dark:focus:ring-blue-900">
          </label>
        </div>
        <label id="mobile-number-label" class="hidden grid gap-1.5 text-sm font-medium" for="mobile-number">
          Mobile number
          <input id="mobile-number" name="mobile_number" type="tel" autocomplete="tel" inputmode="tel" maxlength="32"
            class="rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-base outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-200 dark:border-slate-600 dark:bg-slate-800 dark:focus:ring-blue-900">
        </label>
        <label id="email-label" class="grid gap-1.5 text-sm font-medium" for="email">
          Email
          <input id="email" name="email" type="email" autocomplete="email" required maxlength="320"
            class="rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-base outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-200 dark:border-slate-600 dark:bg-slate-800 dark:focus:ring-blue-900">
        </label>
        <label id="password-label" class="grid gap-1.5 text-sm font-medium" for="password">
          Password
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="10" maxlength="128"
            class="rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-base outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-200 dark:border-slate-600 dark:bg-slate-800 dark:focus:ring-blue-900">
          <span id="password-hint" class="text-xs font-normal text-slate-500 dark:text-slate-400">Use at least 10 characters.</span>
        </label>
        <label id="password-confirmation-label" class="hidden grid gap-1.5 text-sm font-medium" for="password-confirmation">
          Confirm password
          <input id="password-confirmation" name="password_confirmation" type="password" autocomplete="new-password" maxlength="128"
            class="rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-base outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-200 dark:border-slate-600 dark:bg-slate-800 dark:focus:ring-blue-900">
        </label>
        <p id="auth-error" class="hidden rounded-lg bg-red-50 p-3 text-sm text-red-800 dark:bg-red-950 dark:text-red-200" role="alert"></p>
        <button id="submit-button" type="submit"
          class="mt-1 rounded-lg bg-blue-700 px-4 py-3 font-semibold text-white hover:bg-blue-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 disabled:cursor-wait disabled:opacity-60">
          Sign in
        </button>
      </form>
      <div id="google-login" class="mt-5">
        <div class="mt-5 text-center text-xs text-slate-500 dark:text-slate-400">
          OR
        </div>
        <a href="/auth/google"
          class="flex w-full items-center justify-center gap-3 rounded-lg border border-slate-300 bg-white px-4 py-3 font-semibold text-slate-700 hover:bg-slate-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:hover:bg-slate-800">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.73 7.18l7.72 6C44.43 37.89 46.98 31.7 46.98 24.55Z"/>
            <path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.54 2.56 10.78l7.97-6.19Z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.72-6c-2.14 1.44-4.89 2.3-8.19 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"/>
          </svg>
          Continue with Google
        </a>
      </div>
      <a id="forgot-password-link" class="mt-4 block text-center text-sm font-semibold text-blue-700 hover:underline dark:text-blue-300" href="/forgot-password">
        Forgot password?
      </a>
      <p id="auth-success" class="hidden mt-6 rounded-lg bg-slate-100 p-3 text-sm text-slate-800 dark:bg-slate-800 dark:text-slate-200" role="status"></p>

      <p class="mt-6 text-center text-sm text-slate-600 dark:text-slate-400">
        <span id="mode-prompt">New to AuricAI?</span>
        <a id="mode-link" class="font-semibold text-blue-700 hover:underline dark:text-blue-300" href="/register">Create an account</a>
      </p>
    </section>
  </main>
  <script>
    const pagePath = window.location.pathname;
    const registering = pagePath === "/register";
    const requestingReset = pagePath === "/forgot-password";
    const resettingPassword = pagePath === "/reset-password";
    const resetToken = resettingPassword
      ? new URLSearchParams(window.location.hash.slice(1)).get("token") || ""
      : "";
    if (resettingPassword && window.location.hash) {
      window.history.replaceState(null, "", window.location.pathname);
    }
    const form = document.getElementById("auth-form");
    const title = document.getElementById("page-title");
    const description = document.getElementById("page-description");
    const password = document.getElementById("password");
    const email = document.getElementById("email");
    const emailLabel = document.getElementById("email-label");
    const passwordLabel = document.getElementById("password-label");
    const registrationFields = document.getElementById("registration-fields");
    const mobileNumberLabel = document.getElementById("mobile-number-label");
    const passwordConfirmationLabel = document.getElementById("password-confirmation-label");
    const registrationInputs = [
      document.getElementById("first-name"),
      document.getElementById("last-name"),
      document.getElementById("mobile-number"),
      document.getElementById("password-confirmation")
    ];
    const passwordHint = document.getElementById("password-hint");
    const button = document.getElementById("submit-button");
    const errorNode = document.getElementById("auth-error");
    const modePrompt = document.getElementById("mode-prompt");
    const modeLink = document.getElementById("mode-link");
    const forgotPasswordLink = document.getElementById("forgot-password-link");
    const googleLogin = document.getElementById("google-login");
    const passwordConfirmation = document.getElementById("password-confirmation");
    const successNode = document.getElementById("auth-success");

    if (registering) {
      title.textContent = "Create your account";
      description.textContent = "Register with your email to access the market dashboard.";
      password.autocomplete = "new-password";
      registrationFields.classList.remove("hidden");
      registrationFields.classList.add("grid");
      mobileNumberLabel.classList.remove("hidden");
      passwordConfirmationLabel.classList.remove("hidden");
      registrationInputs.forEach((input) => { input.required = true; });
      button.textContent = "Create account";
      modePrompt.textContent = "Already registered?";
      modeLink.textContent = "Sign in";
      modeLink.href = "/login";
      forgotPasswordLink.classList.add("hidden");
    } else if (requestingReset) {
      title.textContent = "Reset your password";
      description.textContent = "Enter your email and we’ll send a password reset link if an account exists.";
      passwordLabel.classList.add("hidden");
      password.required = false;
      button.textContent = "Send reset link";
      modePrompt.textContent = "Remembered your password?";
      modeLink.textContent = "Sign in";
      modeLink.href = "/login";
      forgotPasswordLink.classList.add("hidden");
      googleLogin.classList.add("hidden");
    } else if (resettingPassword) {
      title.textContent = "Choose a new password";
      description.textContent = "The reset link expires 30 minutes after it was requested.";
      emailLabel.classList.add("hidden");
      email.required = false;
      password.autocomplete = "new-password";
      passwordConfirmationLabel.classList.remove("hidden");
      passwordConfirmation.required = true;
      button.textContent = "Update password";
      modePrompt.textContent = "Need another link?";
      modeLink.textContent = "Request a new reset link";
      modeLink.href = "/forgot-password";
      forgotPasswordLink.classList.add("hidden");
      googleLogin.classList.add("hidden");
    }

    if (registering) {
      googleLogin.classList.add("hidden");
    }

    const googleError = new URLSearchParams(window.location.search).get("google_error");
    const googleErrorMessages = {
      not_configured: "Google sign-in is not configured yet. Ask the site administrator.",
      unavailable: "Google sign-in is temporarily unavailable. Please try again.",
      failed: "Google sign-in could not be completed. Please try again.",
      invalid_profile: "Google did not provide a valid account profile.",
      unverified_email: "Your Google email must be verified before signing in."
    };
    if (googleError && googleErrorMessages[googleError]) {
      errorNode.textContent = googleErrorMessages[googleError];
      errorNode.classList.remove("hidden");
      window.history.replaceState(null, "", window.location.pathname);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorNode.classList.add("hidden");
      button.disabled = true;
      try {
        const endpoint = registering
          ? "/auth/register"
          : requestingReset
            ? "/auth/forgot-password"
            : resettingPassword
              ? "/auth/reset-password"
              : "/auth/login";
        const payload = requestingReset
          ? { email: email.value }
          : resettingPassword
            ? {
                token: resetToken,
                password: password.value,
                password_confirmation: passwordConfirmation.value
              }
            : {
                email: email.value,
                password: password.value,
                ...(registering ? {
                  first_name: document.getElementById("first-name").value,
                  last_name: document.getElementById("last-name").value,
                  mobile_number: document.getElementById("mobile-number").value,
                  password_confirmation: passwordConfirmation.value
                } : {})
              };
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok) {
          const detail = Array.isArray(data.detail)
            ? data.detail.map((issue) => issue.msg).join(" ")
            : data.detail;
          throw new Error(typeof detail === "string" ? detail : "Account request failed.");
        }
        if (requestingReset) {
          form.classList.add("hidden");
          forgotPasswordLink.classList.add("hidden");
          successNode.textContent = data.message;
          successNode.classList.remove("hidden");
        } else if (resettingPassword) {
          form.classList.add("hidden");
          forgotPasswordLink.classList.add("hidden");
          successNode.textContent = data.message;
          successNode.classList.remove("hidden");
          modePrompt.textContent = "Password updated?";
          modeLink.textContent = "Sign in";
          modeLink.href = "/login";
        } else {
          window.location.assign("/");
        }
      } catch (error) {
        errorNode.textContent = error.message || "Could not connect to AuricAI.";
        errorNode.classList.remove("hidden");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
